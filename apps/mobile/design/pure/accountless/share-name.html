<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopZebra - Name beim ersten Teilen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<!--
  Variant 1A (chosen 2026-08-02): bottom sheet over the list.
  Shown once, the first time the user shares anything. Confirming
  creates the shadow account and drains the outbox to the server.
-->
</head>
<body>

<div class="phone-frame">
  <div class="screen">
    <div class="status-bar">
      <div class="status-time">9:41</div>
      <div class="status-icons">
        <svg viewBox="0 0 16 16"><path d="M1.5 4.5C4 2 7.5 1 8 1s4 1 6.5 3.5l-1.2 1.2C11.2 3.6 9 2.5 8 2.5S4.8 3.6 2.7 5.7L1.5 4.5zM4 7.3C5.3 6 6.8 5.2 8 5.2s2.7.8 4 2.1L10.8 8.5C9.8 7.5 9 7 8 7s-1.8.5-2.8 1.5L4 7.3zM6.5 10c.8-.8 1.2-1 1.5-1s.7.2 1.5 1L8 11.5 6.5 10z"/></svg>
        <svg viewBox="0 0 16 16"><path d="M1 4h2v8H1V4zm3.5 2h2v6h-2V6zM8 3h2v9H8V3zm3.5 1h2v8h-2V4z"/></svg>
        <svg viewBox="0 0 24 14"><rect x="0.5" y="0.5" width="20" height="13" rx="2.5" stroke="white" stroke-opacity="0.35" fill="none"/><path opacity="0.4" d="M22 5v4a2 2 0 000-4z" fill="white"/><rect x="2" y="2" width="15" height="9" rx="1.5" fill="white"/></svg>
      </div>
    </div>

    <div class="nav-header">
      <a class="nav-back" href="../lists.html">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Listen
      </a>
      <div class="nav-title">Wocheneinkauf</div>
      <div class="nav-spacer"></div>
    </div>

    <!-- Background context: the list the user just tried to share -->
    <div class="pad">
      <div class="list-tile"><div class="list-emoji" style="background:rgba(107,191,107,0.15)">&#129382;</div><div><div class="list-name">Wocheneinkauf</div><div class="list-meta">12 Sachen &middot; nur auf diesem Ger&auml;t</div></div></div>
      <div class="list-tile"><div class="list-emoji" style="background:rgba(232,146,58,0.15)">&#127838;</div><div><div class="list-name">B&auml;cker</div><div class="list-meta">3 Sachen</div></div></div>
      <div class="list-tile"><div class="list-emoji" style="background:rgba(78,157,166,0.15)">&#127881;</div><div><div class="list-name">Geburtstag</div><div class="list-meta">8 Sachen</div></div></div>
    </div>
  </div>

  <!-- Sheet: asked once, before the very first invite -->
  <div class="sheet-backdrop"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Wie sollen dich andere sehen?</div>
    <div class="sheet-text">Der Name steht neben deinen &Auml;nderungen in geteilten Listen. Du kannst ihn jederzeit &auml;ndern.</div>
    <input class="input mb16" id="nameInput" type="text" value="Chris" autocomplete="name">
    <a class="btn btn-primary" href="../invite.html">Weiter zum Einladen</a>
  </div>
</div>

</body>
</html>
