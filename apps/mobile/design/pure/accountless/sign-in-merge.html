<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopZebra - Anmelden und zusammenf&uuml;hren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<!--
  Variant 6A (chosen 2026-08-02): sheet with the counts, shown before the merge.
  The merge itself is automatic and additive — no "local or remote?" choice.
  Abbrechen aborts the sign-in and leaves the guest state untouched.
-->
</head>
<body>

<div class="phone-frame">
  <div class="screen">
    <div class="status-bar">
      <div class="status-time">9:41</div>
      <div class="status-icons">
        <svg viewBox="0 0 16 16"><path d="M1.5 4.5C4 2 7.5 1 8 1s4 1 6.5 3.5l-1.2 1.2C11.2 3.6 9 2.5 8 2.5S4.8 3.6 2.7 5.7L1.5 4.5zM4 7.3C5.3 6 6.8 5.2 8 5.2s2.7.8 4 2.1L10.8 8.5C9.8 7.5 9 7 8 7s-1.8.5-2.8 1.5L4 7.3zM6.5 10c.8-.8 1.2-1 1.5-1s.7.2 1.5 1L8 11.5 6.5 10z"/></svg>
        <svg viewBox="0 0 16 16"><path d="M1 4h2v8H1V4zm3.5 2h2v6h-2V6zM8 3h2v9H8V3zm3.5 1h2v8h-2V4z"/></svg>
        <svg viewBox="0 0 24 14"><rect x="0.5" y="0.5" width="20" height="13" rx="2.5" stroke="white" stroke-opacity="0.35" fill="none"/><path opacity="0.4" d="M22 5v4a2 2 0 000-4z" fill="white"/><rect x="2" y="2" width="15" height="9" rx="1.5" fill="white"/></svg>
      </div>
    </div>

    <div class="nav-header">
      <a class="nav-back" href="email-exists.html">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Zur&uuml;ck
      </a>
      <div class="nav-title">Anmelden</div>
      <div class="nav-spacer"></div>
    </div>

    <!-- Background: the sign-in form the user just submitted -->
    <div class="pad" style="opacity:0.5">
      <div class="field-label">E-Mail</div>
      <div class="input mb16">chris@example.com</div>
      <div class="field-label">Passwort</div>
      <div class="input">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div>
    </div>
  </div>

  <div class="sheet-backdrop"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Deine Listen kommen mit</div>
    <div class="sheet-text">Auf diesem Ger&auml;t liegen <b>4 Listen</b> und <b>6 Rezepte</b>. Sie werden deinem Konto hinzugef&uuml;gt &mdash; nichts wird ersetzt oder gel&ouml;scht.</div>
    <a class="btn btn-primary" href="../lists.html">Weiter</a>
    <a class="btn-text muted" href="../profile.html">Abbrechen</a>
  </div>
</div>

</body>
</html>
