<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal A — Branded Spinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PROPOSAL A — Branded Spinner (Vollbild)
     Beim ersten Laden zeigt die App ein zentriertes Marken-
     Element: Zebra-Emoji + Teal-Ring-Spinner + Statustext.
     Kein App-Chrome sichtbar, bis die Daten da sind.
     ============================================================ */

  [data-theme="dark"] {
    --body-bg: #0a0a0e;
    --screen-bg: #121216;
    --surface: rgba(255,255,255,0.04);
    --surface-border: rgba(255,255,255,0.06);
    --teal: #4E9DA6;
    --orange: #E8923A;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.5);
    --text-dim: rgba(255,255,255,0.35);
    --card-bg: rgba(255,255,255,0.03);
    --card-border: rgba(255,255,255,0.06);
    --chip-bg: rgba(255,255,255,0.06);
    --chip-border: rgba(255,255,255,0.08);
    --frame-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 120px rgba(78,157,166,0.05);
    --nav-bg: rgba(18,18,22,0.85);
    --nav-border: rgba(255,255,255,0.06);
    --green-bg: rgba(107,191,107,0.12);
    --blue-bg: rgba(91,168,213,0.12);
    --red-bg: rgba(224,123,123,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--body-bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--text-primary);
  }

  .phone-frame {
    width: 390px;
    height: 844px;
    background: var(--screen-bg);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: var(--frame-shadow);
  }

  .screen {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 100px;
    scrollbar-width: none;
    background-color: var(--screen-bg);
  }
  .screen::-webkit-scrollbar { display: none; }

  /* ===== Loading State: Vollbild-Spinner ===== */
  .loading-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--screen-bg);
    z-index: 200;
    transition: opacity 0.4s ease;
  }
  .loading-state.hidden { opacity: 0; pointer-events: none; }

  .spinner-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid rgba(78,157,166,0.12);
    border-top-color: var(--teal);
    animation: spin 0.9s linear infinite;
    box-shadow: 0 0 30px rgba(78,157,166,0.1);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .spinner-emoji {
    font-size: 42px;
    line-height: 1;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .loading-brand {
    font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .loading-text {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
  }
  .loading-text::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  /* ===== Geladener Inhalt (vereinfachte Listen-Übersicht) ===== */
  .content { opacity: 0; transition: opacity 0.4s ease; }
  .content.visible { opacity: 1; }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px 8px;
  }
  .status-time { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }

  .header { text-align: center; padding: 16px 24px 20px; }
  .header-title {
    font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif;
    font-size: 24px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px;
  }
  .header-subtitle { font-size: 13px; font-weight: 500; color: var(--text-dim); }

  .summary-row { display: flex; gap: 8px; padding: 0 20px 18px; justify-content: center; }
  .summary-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--chip-bg); border: 1px solid var(--chip-border);
    border-radius: 16px; padding: 7px 14px;
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
  }
  .summary-chip-num { color: var(--teal); font-weight: 700; }

  .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 20px; }
  .tile {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 22px; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .tile-icon-bg {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-icon-bg.green { background: var(--green-bg); }
  .tile-icon-bg.blue { background: var(--blue-bg); }
  .tile-icon-bg.red { background: var(--red-bg); }
  .tile-emoji { font-size: 36px; line-height: 1; }
  .tile-name {
    font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 700; line-height: 1.2;
  }
  .tile-meta { font-size: 12px; font-weight: 500; color: var(--text-dim); }

  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--nav-border);
    display: flex; justify-content: space-around; align-items: flex-start;
    padding: 12px 16px 32px; z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    color: var(--text-dim); font-size: 10px; font-weight: 600;
    position: relative; min-width: 56px;
  }
  .nav-item.active { color: var(--teal); }
  .nav-item svg { width: 24px; height: 24px; fill: currentColor; }

  /* ===== Replay (nur fürs Proposal) ===== */
  .replay-btn {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--teal); color: #fff; border: none;
    border-radius: 12px; padding: 10px 18px;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- Loading State -->
  <div class="loading-state" id="loadingState">
    <div class="spinner-wrap">
      <div class="spinner-ring"></div>
      <span class="spinner-emoji">&#x1F993;</span>
    </div>
    <div class="loading-brand">ShopZebra</div>
    <div class="loading-text">Deine Listen werden geladen</div>
  </div>

  <!-- Geladener Inhalt -->
  <div class="screen">
    <div class="content" id="content">
      <div class="status-bar"><div class="status-time">9:41</div></div>
      <div class="header">
        <h1 class="header-title">Meine Listen</h1>
        <p class="header-subtitle">Familie Weber</p>
      </div>
      <div class="summary-row">
        <div class="summary-chip"><span class="summary-chip-num">3</span> Listen</div>
        <div class="summary-chip"><span class="summary-chip-num">41</span> Items</div>
        <div class="summary-chip"><span class="summary-chip-num">4</span> Mitglieder</div>
      </div>
      <div class="tile-grid">
        <div class="tile">
          <div class="tile-icon-bg green"><span class="tile-emoji">&#x1F6D2;</span></div>
          <div class="tile-name">REWE Wocheneinkauf</div>
          <div class="tile-meta">15 Items &middot; 3 Pers.</div>
        </div>
        <div class="tile">
          <div class="tile-icon-bg blue"><span class="tile-emoji">&#x1F9F4;</span></div>
          <div class="tile-name">dm Drogerie</div>
          <div class="tile-meta">4 Items &middot; Papa</div>
        </div>
        <div class="tile">
          <div class="tile-icon-bg red"><span class="tile-emoji">&#x1F389;</span></div>
          <div class="tile-name">Geburtstagsparty Lena</div>
          <div class="tile-meta">22 Items &middot; 4 Pers.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav (erscheint mit dem Inhalt) -->
  <div class="bottom-nav content" id="navContent">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      <span>Listen</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      <span>Planen</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M8.1 13.34l2.83-2.83L3.91 3.5a4.008 4.008 0 000 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/></svg>
      <span>Rezepte</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <span>Aktivit&auml;t</span>
    </div>
  </div>
</div>

<button class="replay-btn" onclick="replay()">&#x21BB; Replay</button>

<script>
  var LOAD_TIME_MS = 2500;

  function showLoading() {
    document.getElementById('loadingState').classList.remove('hidden');
    document.getElementById('content').classList.remove('visible');
    document.getElementById('navContent').classList.remove('visible');
  }
  function showContent() {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('content').classList.add('visible');
    document.getElementById('navContent').classList.add('visible');
  }
  function replay() {
    showLoading();
    setTimeout(showContent, LOAD_TIME_MS);
  }
  setTimeout(showContent, LOAD_TIME_MS);
</script>

</body>
</html>
