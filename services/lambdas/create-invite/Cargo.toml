[package]
name = "create-invite"
version = "0.1.0"
edition = "2021"

[dependencies]
adapters = { path = "../../adapters" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
domain = { path = "../../domain" }
lambda_http = "0.13"
lib = { path = "../../lib" }
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
